---
services:
  kiptv:
    image: k-iptv:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "4333:80"
    environment:
      BACKEND_URL: /api
      CLIENT_URL: http://localhost:4333
      PORT: "3000"
      KIPTV_PROXY_ALLOW_PRIVATE_NETWORKS: "0"
      # Server storage database on the /data volume. Set to "none" to keep
      # the backend stateless.
      KIPTV_STORAGE: server
      # Ask every browser for this token once before it shows the library.
      # KIPTV_ACCESS_TOKEN: change-me
    volumes:
      - kiptv-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  kiptv-data: {}
